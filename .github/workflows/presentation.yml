name: MESH presentation
on:
  push:
    branches: [main]
    paths:
      - "docs/presentation/**"
      - ".github/workflows/presentation.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: mesh-pages
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_name: ${{ steps.identity.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Give each attempt an unambiguous artifact identity
        id: identity
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.identity.outputs.name }}
          path: docs/presentation
      - name: Verify that the uploaded artifact is visible
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.identity.outputs.name }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            count=$(curl --fail --silent --show-error               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts"               | jq --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.name == $name)] | length')
            if test "$count" = 1; then exit 0; fi
            echo "Artifact metadata not ready; attempt $attempt/6"
            sleep 5
          done
          exit 1
  deploy:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the exact packaged presentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.package.outputs.artifact_name }}
