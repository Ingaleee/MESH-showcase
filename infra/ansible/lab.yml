---
- name: Prepare an isolated ephemeral Ubuntu release lab
  hosts: all
  become: true
  gather_facts: true
  pre_tasks:
    - name: Validate the lab host
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
          - ansible_facts.distribution_version == "24.04"
          - ansible_facts.architecture == "x86_64"
          - ansible_facts.memtotal_mb >= 5600
  roles:
    - docker_host
