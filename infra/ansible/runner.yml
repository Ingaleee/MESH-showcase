---
- name: Prepare the isolated trusted MESH runner host
  hosts: showcase
  become: true
  gather_facts: true
  pre_tasks:
    - name: Validate the chosen host
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
          - ansible_facts.distribution_version in ["22.04", "24.04"]
          - ansible_facts.architecture == "x86_64"
          - ansible_facts.memtotal_mb >= 5600
        fail_msg: Use a dedicated Ubuntu x64 VM with at least 6 GiB RAM.
  roles:
    - docker_host
    - github_runner
