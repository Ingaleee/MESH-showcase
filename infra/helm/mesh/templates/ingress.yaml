{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
spec:
  ingressClassName: {{ required "Choose the installed ingress class" .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.hostname | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.hostname | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: {{ .Release.Name }}-api, port: {number: 3000}}
          - path: /cable
            pathType: Prefix
            backend:
              service: {name: {{ .Release.Name }}-api, port: {number: 3000}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ .Release.Name }}-web, port: {number: 3000}}
{{- end }}
