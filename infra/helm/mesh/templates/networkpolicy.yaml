{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels: {app: {{ .Release.Name }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceLabels | nindent 14 }}
      ports: [{protocol: TCP, port: 3000}]
    - from:
        - podSelector:
            matchLabels: {app: {{ .Release.Name }}}
      ports: [{protocol: TCP, port: 3000}]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: {{ .Release.Name }}}
      ports: [{protocol: TCP, port: 3000}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dependencyPodLabels | nindent 14 }}
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 3102}
        - {protocol: TCP, port: 3310}
    {{- range .Values.networkPolicy.externalDependencies }}
    - to:
        - ipBlock: {cidr: {{ .cidr | quote }}}
      ports:
        {{- range .ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
{{- end }}
